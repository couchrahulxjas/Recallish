[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recallish"
version = "0.1.0"
description = "Local-first memory engine backed by ChromaDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=1.0.0,<2.0.0",
  "sentence-transformers>=3.0.0,<4.0.0",
  "PyYAML>=6.0.2,<7.0.0",
  "mcp>=1.12.4,<2.0.0",
  "fastapi>=0.110.0,<1.0.0",
  "uvicorn[standard]>=0.29.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "openai>=1.30.0,<2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]
api = ["fastapi>=0.110.0,<1.0.0", "uvicorn[standard]>=0.29.0,<1.0.0"]

[project.scripts]
recallish = "recallish.cli:main"
recallish-mcp = "recallish.mcp_server:run"
recallish-api = "recallish.http_api:run"
recallish-fastapi = "recallish.fastapi_server:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["recallish*"]
